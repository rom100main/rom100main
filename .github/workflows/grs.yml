name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # daily
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/grs.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_rank=true&exclude_repo=english-arcade-games&show_icons=true&hide_border=true&bg_color=00000000&theme=dark
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_rank=true&exclude_repo=english-arcade-games&show_icons=true&hide_border=true&bg_color=00000000
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&exclude_repo=english-arcade-games&hide_border=true&bg_color=00000000&theme=dark
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&exclude_repo=english-arcade-games&hide_border=true&bg_color=00000000
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Datalith pin card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=mycelium-build&repo=datalith-app&show_owner=true&hide_border=true&bg_color=00000000&theme=dark
          path: profile/pin-datalith-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Datalith pin card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=mycelium-build&repo=datalith-app&show_owner=true&hide_border=true&bg_color=00000000
          path: profile/pin-datalith-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Arbor pin card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=rom100main&repo=arbor&show_owner=true&hide_border=true&bg_color=00000000&theme=dark
          path: profile/pin-arbor-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Arbor pin card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=rom100main&repo=arbor&show_owner=true&hide_border=true&bg_color=00000000
          path: profile/pin-arbor-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
